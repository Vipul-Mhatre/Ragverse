version: '3.9'
services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    environment:
      - NEXT_PUBLIC_API_BASE=http://backend:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
